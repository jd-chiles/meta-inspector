<!-- Original rights-cleared icon for the Habitability Walkthrough Companion.
  Hand-authored geometric mark (house outline + review check) in the app theme
  palette (#0b5cad on #eef3f8). No third-party assets, fonts, or trademarks. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192" role="img" aria-label="Habitability Walkthrough Companion app icon">
  <rect x="8" y="8" width="176" height="176" rx="40" fill="#0b5cad"/>
  <rect x="8" y="8" width="176" height="176" rx="40" fill="none" stroke="#eef3f8" stroke-width="6" opacity="0.35"/>
  <!-- House outline -->
  <path d="M96 44 L52 84 v56 a8 8 0 0 0 8 8 h72 a8 8 0 0 0 8-8 V84 Z" fill="none" stroke="#ffffff" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Door opening -->
  <path d="M84 148 v-28 h24 v28" fill="none" stroke="#ffffff" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Review check -->
  <path d="M78 108 l14 14 26-30" fill="none" stroke="#7fd08c" stroke-width="11" stroke-linejoin="round" stroke-linecap="round"/>
</svg>
