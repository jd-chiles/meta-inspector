<!-- Original rights-cleared icon for the Habitability Walkthrough Companion.
  Hand-authored geometric mark (house outline + review check) in the app theme
  palette (#0b5cad on #eef3f8). No third-party assets, fonts, or trademarks. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Habitability Walkthrough Companion app icon">
  <rect x="20" y="20" width="472" height="472" rx="108" fill="#0b5cad"/>
  <rect x="20" y="20" width="472" height="472" rx="108" fill="none" stroke="#eef3f8" stroke-width="14" opacity="0.35"/>
  <!-- House outline -->
  <path d="M256 118 L138 224 v150 a22 22 0 0 0 22 22 h192 a22 22 0 0 0 22-22 V224 Z" fill="none" stroke="#ffffff" stroke-width="26" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Door opening -->
  <path d="M224 396 v-74 h64 v74" fill="none" stroke="#ffffff" stroke-width="26" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Review check -->
  <path d="M208 288 l36 36 68-80" fill="none" stroke="#7fd08c" stroke-width="30" stroke-linejoin="round" stroke-linecap="round"/>
</svg>
